# COCO 2017 Keypoints dataset https://cocodataset.org by Microsoft
# Documentation: https://docs.ultralytics.com/datasets/pose/coco/
# Example usage: yolo train data=coco-pose.yaml
# parent
# ├── ultralytics
# └── datasets
#     └── coco-pose  ← downloads here (20.1 GB)

# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
path: Z:/datasets/segment/bbr_segpose_yolo/pose # dataset root dir
train: images/train # train images (relative to 'path') 56599 images
val: images/val # val images (relative to 'path') 2346 images
test: # 20288 of 40670 images, submit to https://codalab.lisn.upsaclay.fr/competitions/7403

# Keypoints
kpt_shape: [1, 3] # number of keypoints, number of dims (2 for x,y or 3 for x,y,visible)
flip_idx: [0]

# Classes
names:
  0: 0

